name: Android APK

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Unit tests and assemble installable APK
        run: gradle :app:testMobileDebugUnitTest :app:testAutomotiveDebugUnitTest :app:lintMobileDebug :app:lintAutomotiveDebug :app:assembleMobileDebug :app:assembleAutomotiveDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tromuwelle-debug-apk
          path: |
            app/build/outputs/apk/mobile/debug/*.apk
            app/build/outputs/apk/automotive/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  prerelease:
    needs: apk
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version from branch
        id: release
        run: echo "tag=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: tromuwelle-debug-apk
          path: release-assets
      - name: Prepare APK
        run: |
          mkdir -p publish
          cp release-assets/mobile/debug/app-mobile-debug.apk "publish/tromuwelle-android-${GITHUB_REF_NAME#release/}.apk"
          cp release-assets/automotive/debug/app-automotive-debug.apk "publish/tromuwelle-automotive-video-${GITHUB_REF_NAME#release/}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Tromuwelle Android ${{ steps.release.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            Zwei Android-APKs (API 26+): Android Auto (Audio) und AAOS (Video nur im Parkmodus).
            Vorabversion mit temporärem Debugschlüssel, keine produktive Signatur; Updates erfordern ggf. Neuinstallation.
            Der Server benötigt HTTPS; eine private CA muss auf dem Gerät installiert sein.
            Gerätetests (Android Auto DHU und Android Automotive OS Emulator/Fahrzeug) sowie echte Subsonic-Servertests stehen noch aus.
          files: publish/*.apk
          fail_on_unmatched_files: true
